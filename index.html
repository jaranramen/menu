<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="./assets/menu/jaran.ico" type="logo.icon" />   
  <link rel="icon" href="./assets/menu/jaran.ico" type="logo.icon" /> 
  <title>Jaran Online Menu</title>

  <!-- Tailwindは任意：ユーティリティを使いたいなら残す -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->

  <link rel="stylesheet" href="./styles.css" />

  <!-- フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body class="page max-w-md mx-auto pb-10">
  <header class="header sticky top-0 z-10">
    <div class="header__inner px-4 py-4 text-center">
      <h1>
        <img src="./assets/menu/jaran-sign.png" alt="Jaran" class="img">
      </h1>
      <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">The first ramen shop in Iran</p>

      <div class="lang-tabs mt-4 border-t pt-3" role="tablist" aria-label="Language switcher">
        <button type="button" id="btn-en" class="lang-tabs__btn is-active" data-lang="en" role="tab" aria-selected="true">English</button>
        <button type="button" id="btn-fa" class="lang-tabs__btn" data-lang="fa" role="tab" aria-selected="false">فارسی</button>
      </div>
    </div>
  </header>

  <main class="px-4 mt-6">
    <section class="text-center mb-8 px-2" aria-label="Commitment">
      <p id="commit-text" class="italic text-gray-600 text-xs leading-relaxed"></p>
    </section>

    <div id="sections-root"></div>
  </main>

  <!-- Footer -->
  <footer class="site-footer px-4 mt-10 pb-10" aria-label="Footer">

    <!-- 既存の税表記（app.jsが言語切替でテキストを入れる） -->
    <div class="footer-note" id="footer-note"></div>

    <div class="footer-links">
      <a class="footer-icon"
        href="https://www.instagram.com/jaran_ramen/"
        target="_blank" rel="noopener noreferrer"
        aria-label="Instagram">
        <!-- Instagram SVG -->
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm10 2c1.65 0 3 1.35 3 3v10c0 1.65-1.35 3-3 3H7c-1.65 0-3-1.35-3-3V7c0-1.65 1.35-3 3-3h10zm-5 3.5A4.5 4.5 0 1 0 16.5 12 4.5 4.5 0 0 0 12 7.5zm0 2A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5zM17.75 6.25a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/>
        </svg>
      </a>

      <a class="footer-icon"
        href="https://maps.app.goo.gl/GfHYjdfiixksD9pF9"
        target="_blank" rel="noopener noreferrer"
        aria-label="Google Maps">
        <!-- Map pin SVG -->
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 14.5 9 2.5 2.5 0 0 1 12 11.5z"/>
        </svg>
      </a>
    </div>


    <!-- TODO: 店舗住所に置換（必要なら英/ペルシャ語で2行にしてOK） -->
    <div class="footer-address">
      Yazd, Iran / بلوار فلسطین جنب املاک رفیعی
    </div>


  </footer>


  <!-- Modal（将来の詳細表示拡張用。今の段階で実装も入れる） -->
  <div id="modal-overlay" class="modal-overlay" hidden></div>

  <dialog id="item-modal" class="modal" aria-label="Menu item details">
    <form method="dialog" class="modal__frame">
      <button class="modal__close" value="cancel" aria-label="Close">×</button>

      <div class="modal__media">
        <img id="modal-image" alt="" loading="lazy">
      </div>

      <div class="modal__body">
        <div class="modal__head">
          <h3 id="modal-title" class="modal__title"></h3>
          <div id="modal-price" class="modal__price"></div>
        </div>

        <p id="modal-desc" class="modal__desc"></p>

        <!-- 将来拡張領域（例：アレルゲン、辛さ、注意事項、売り切れ等） -->
        <div id="modal-meta" class="modal__meta"></div>

        <menu class="modal__actions">
          <button value="cancel" class="modal__btn">Close</button>
        </menu>
      </div>
    </form>
  </dialog>

  <script src="./menu-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
